name: Collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Recoge y guarda capturas de clanes
    runs-on: ubuntu-latest
    # Los secretos no están configurados en forks, así que esto se vuelve
    # un no-op inofensivo ahí en vez de fallar el workflow con un error de
    # configuración confuso.
    if: github.repository == 'AndresChili/ClashLeader'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Comprobar que los secretos necesarios están configurados
        id: secrets-check
        run: |
          if [ -z "${{ secrets.CLASH_API_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "Secretos todavía no configurados; se omite esta ejecución en vez de fallar repetidamente."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar el recolector
        if: steps.secrets-check.outputs.ready == 'true'
        run: npm run collector
        env:
          CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}
          CLASH_API_BASE_URL: ${{ vars.CLASH_API_BASE_URL || 'https://cocproxy.royaleapi.dev/v1' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_CLANS_PER_RUN: ${{ vars.MAX_CLANS_PER_RUN || '20' }}
